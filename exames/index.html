ades da saúde, contando com uma das mais completas equipes médicas do sul catarinense.","image":"/clinigastro-demo/assets/maneco/unidade.webp","storyTitle":"Quem somos","story":["A Clinigastro é um hospital dia: um hospital preparado para consultas, exames e procedimentos que não exigem internação longa. Você é atendido com toda a estrutura e a segurança de um hospital e volta para casa no mesmo dia.","Referência no atendimento às doenças do aparelho digestivo, a Clinigastro é especializada em exames de endoscopia, colonoscopia e ecoendoscopia, para diagnóstico e tratamento, e em tratamentos da obesidade com balão intragástrico.","Atende também diversas áreas da saúde, com uma das equipes médicas mais completas do sul catarinense."],"gallery":[{"image":"/clinigastro-demo/assets/uploads/2025/01/2-scaled.jpg.webp","alt":"Instalações da Clinigastro"},{"image":"/clinigastro-demo/assets/uploads/2025/01/3-scaled.jpg.webp","alt":"Instalações da Clinigastro"},{"image":"/clinigastro-demo/assets/uploads/2025/01/4-scaled.jpg.webp","alt":"Instalações da Clinigastro"},{"image":"/clinigastro-demo/assets/uploads/2025/01/5-scaled.jpg.webp","alt":"Instalações da Clinigastro"}],"missaoTitle":"Nossa missão","missao":[{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon1.png","text":"Prestar atendimento humanizado e responsável."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon2.png","text":"Descobrir as doenças no seu início."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon3.png","text":"Promover o tratamento eficaz."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon4.png","text":"Possibilitar trabalhos de pesquisa e observação clínica."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon5.png","text":"Promover o aprimoramento técnico dos médicos, técnicos e funcionários."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon6.png","text":"Melhorar a qualidade de vida dos pacientes com responsabilidade social."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon7.png","text":"Integrar em rede digital os dados de história clínica e fontes de imagem."},{"icon":"/clinigastro-demo/assets/uploads/2025/01/missao-icon8.png","text":"Comprometer-se com a Saúde Pública, prestando serviços à população."}],"historiaTitle":"Nossa história","historia":[{"year":"1986","text":"A Clinigastro inova com o primeiro vídeo gastroscópio do mercado mundial (Wellch-Allin). A clínica inicia também a colonoscopia, e divulga a especialidade na região com seis Jornadas Sul-Catarinense de Gastroenterologia."},{"year":"1994","text":"Desde então, o grupo de profissionais na Clinigastro vem crescendo, com a abrangência das áreas de Nutrição, pH-metria, Manometria esofágica e retal e de Cápsula de Vídeo-Enteroscopia."},{"year":"2004","text":"Nova sede em edifício próprio, em Criciúma/SC"},{"year":"2010","text":"Ampliação do espaço criação da Unidade de Endoscopia, com cinco salas de atividades para vídeo-endoscopia, manometria e ph-metria."},{"year":"2016","text":"Novos exames com grande valor diagnóstico\n1- Ecoendoscopia alta e baixa - com punções e biópsias.\n2 - Colangiopancreotografia -  diagnóstica e terapeutica - (C.P.R.E).\n3 - Impedanciometria acoplada com pH-metria esofágica computadorizada."}]},"especialidades":{"eyebrow":"Especialidades e procedimentos","title":"Encontre o cuidado certo para você.","text":"Atendemos diversas áreas da saúde e realizamos procedimentos endoscópicos de baixa e alta complexidade.","searchPlaceholder":"Busque por especialidade ou procedimento","tabEspecialidades":"Especialidades","tabProcedimentos":"Procedimentos","especialidades":[{"slug":"gastroenterologia","title":"Gastroenterologia","icon":"gastro","paragraphs":["Diagnóstico e tratamento de doenças do sistema digestivo, como refluxo, gastrite, úlcera, intestino irritável, entre outras."],"simple":"Cuida de todo o sistema digestivo: esôfago, estômago, intestinos, fígado e pâncreas. É o médico para quem sente azia, dor de estômago, intestino preso ou solto, gases ou má digestão com frequência."},{"slug":"coloproctologia","title":"Coloproctologia","icon":"colon","paragraphs":["Especialidade focada em doenças do cólon, reto e ânus, como hemorroidas, fissuras, fístulas e câncer colorretal."],"simple":"Cuida do intestino grosso, do reto e do ânus. Trata hemorroidas, fissuras e outros incômodos da região e acompanha a prevenção do câncer de intestino."},{"slug":"ortopedia","title":"Ortopedia","icon":"osso","paragraphs":["Avaliação e tratamento de lesões e doenças nos ossos, músculos e articulações, como fraturas, artrose, dores nas costas e joelhos."],"simple":"Cuida dos ossos, músculos e articulações: dores nas costas e nos joelhos, fraturas, torções e desgaste das articulações."},{"slug":"dermatologia","title":"Dermatologia","icon":"pele","paragraphs":["Cuidado com a saúde da pele, cabelos e unhas, incluindo tratamento de acne, alergias, manchas, queda capilar e prevenção do câncer de pele."],"simple":"Cuida da pele, do cabelo e das unhas: manchas, espinhas, alergias, queda de cabelo e a prevenção do câncer de pele."},{"slug":"urologista","title":"Urologia","icon":"rim","paragraphs":["Especialista em saúde urinária e do aparelho reprodutor masculino, tratando infecções, cálculos renais, próstata e disfunções sexuais."],"simple":"Cuida dos rins, da bexiga e das vias urinárias, e também da saúde do homem, incluindo a próstata."},{"slug":"endocrinologia","title":"Endocrinologia","icon":"tireoide","simple":"Cuida dos hormônios e das glândulas que os produzem, como a tireoide. Trata diabetes, obesidade, alterações da tireoide, colesterol e outros desequilíbrios do metabolismo.","paragraphs":["A endocrinologia é a especialidade que diagnostica e trata as doenças das glândulas endócrinas, responsáveis pela produção dos hormônios que regulam o funcionamento do corpo.","Entre os problemas mais acompanhados estão o diabetes, a obesidade, as doenças da tireoide (hipotireoidismo, hipertireoidismo e nódulos), o colesterol alto, a osteoporose e os distúrbios hormonais."]},{"slug":"clinica-geral","title":"Clínica Geral","icon":"medico","simple":"É o médico que olha para a sua saúde como um todo. Faz check-ups, trata problemas do dia a dia e, quando precisa, encaminha para o especialista certo.","paragraphs":["O clínico geral faz o atendimento amplo do adulto: avalia sintomas, solicita e interpreta exames, acompanha doenças crônicas como pressão alta e diabetes e orienta a prevenção.","Também é quem organiza o cuidado, indicando o especialista adequado quando o caso exige uma avaliação mais específica."]},{"slug":"anestesiologista","title":"Anestesiologia","icon":"anestesia","paragraphs":["Profissional responsável pela anestesia e monitoramento da dor durante procedimentos cirúrgicos, garantindo segurança e conforto ao paciente."],"simple":"É o médico que cuida da sua anestesia ou sedação durante exames e cirurgias, para que você fique confortável e seguro do começo ao fim."},{"slug":"otorrinolaringologia","title":"Otorrinolaringologia","icon":"ouvido","paragraphs":["Tratamento de doenças do ouvido, nariz e garganta, como rinite, sinusite, amigdalite, ronco e distúrbios auditivos."],"simple":"Cuida do ouvido, do nariz e da garganta: rinite, sinusite, dor de garganta, ronco e perda de audição."},{"slug":"psicologia","title":"Psicologia","icon":"psicologia","simple":"Um espaço de escuta e acolhimento para cuidar das emoções. Ajuda em ansiedade, tristeza, estresse e também no preparo emocional para tratamentos e mudanças de hábito.","paragraphs":["O psicólogo avalia e acompanha questões emocionais e de comportamento por meio da psicoterapia, ajudando o paciente a compreender seus sentimentos e a lidar melhor com eles.","Na Clinigastro, o acompanhamento psicológico também apoia pacientes em tratamentos para obesidade, doenças digestivas crônicas e mudanças de estilo de vida, em que o lado emocional faz toda a diferença."]},{"slug":"nutricao","title":"Nutrição","icon":"nutricao","paragraphs":["Orientação personalizada para uma alimentação saudável, prevenção e controle de doenças, emagrecimento e qualidade de vida."],"simple":"O nutricionista monta um plano de alimentação feito para você, seja para emagrecer, controlar uma doença ou simplesmente comer melhor."}],"procedimentos":[{"slug":"tratamento-de-hemorroidas","title":"Tratamento de Hemorroidas","icon":"intestino","paragraphs":["O termo hemorroidas refere-se à condição na qual as veias ao redor do ânus ou reto inferior ficam dilatadas, inchadas e inflamadas. Hemorroidas podem ser resultado de esforço para evacuar. Outros fatores que contribuem para a hemorroida são gravidez, constipação crônica, diarreia e intercurso anal. A hemorroida pode ser dentro do ânus (interna) ou abaixo da pele ao redor do ânus (externa).","O seu tratamento pode ser necessário nos casos de sangramentos repetidos, nos casos de trombose hemorroidária (com grandes dores) ou mesmo para facilitar higiene anal como ocorre na hemorroidas externa. Podemos usar calor local, anti-inflamatórios e anestésicos locais. Na hemorroida interna é muito usado a ligadura com anéis elásticos que é feito em nossa Clínica., Outras vezes é necessário cirurgia local."],"simple":"Hemorroidas são veias inchadas na região do ânus que podem sangrar ou doer. Conforme o caso, o tratamento é feito com remédios, com um pequeno elástico aplicado na própria clínica ou com cirurgia."},{"slug":"retirada-de-corpo-estranho","title":"Retirada de Corpo Estranho","icon":"esofago","paragraphs":["A pinça para retirada de corpo estranho é semelhante aquelas de biopsias, porém mais robusta e tem duas pás que se abrem como boca de jacaré que permite fácil apreensão.","Em crianças o mais natural é a deglutição de moedas, nos adultos os corpos estranhos mais frequentes são fragmentos de osso de galinha ou espinhas de peixe. Já em pessoas com debilidade mental, é comum encontrarmos lápis, joaninhas ou até mesmo clips de escritório."],"simple":"Quando alguém engole um objeto, como uma moeda ou uma espinha de peixe, o médico usa o endoscópio e uma pinça delicada para retirá-lo, sem cortes."},{"slug":"polipectomia","title":"Polipectomia","icon":"polipo","paragraphs":["É o procedimento endoscópico em que usamos uma alça metálica de calibre específico, que desliza por um cateter de 2,2 mm que por sua vez desliza dentro do canal de biopsia de 2,8 ou 3,2mm do endoscópico.","Na extremidade distal desta alça metálica existe uma manopla que permite mudar o seu diâmetro para laçar o pólipo que necessita ser extirpado. Próximo a manopla existe um ponto de contato com energia que se origina de uma fonte de eletro-cautério.","Uma vez laçado o pólipo, ativa-se a corrente de corte e coagulação e com devidos cuidados consegue-se extirpar esta lesão poliposa e envia-la para exame microscópico que será feito pelo médico patologista."],"simple":"Pólipos são pequenas elevações que podem surgir no intestino ou no estômago. Alguns podem virar câncer com o tempo, por isso são retirados durante o exame e enviados para análise."},{"slug":"plasma-de-argonio","title":"Plasma de Argônio","icon":"anestesia","paragraphs":["O Plasma de Argônio (APC, Argon Plasma Coagulation) é um método endoscópico de coagulação não contato, que utiliza gás argônio ionizado conduzido por corrente elétrica de alta frequência.","Essa energia é liberada na ponta de uma sonda e atua na superfície da mucosa, promovendo coagulação superficial controlada sem perfurar ou danificar profundamente o tecido."],"simple":"Técnica que usa um gás (o argônio) e energia para cauterizar pequenas lesões ou pontos de sangramento no tubo digestivo, durante a endoscopia."},{"slug":"paracentese","title":"Paracentese","icon":"seringa","paragraphs":["Este procedimento consiste na inserção de uma agulha na cavidade abdominal para a extração de líquido.","Em determinadas circunstâncias (perfuração gástrica, doenças hepáticas, câncer ou ruptura do baço), pode ocorrer o acúmulo de líquido na cavidade abdominal. O médico pode realizar a paracentese para coletar amostra deste líquido e análise, ou para remover o excesso."],"simple":"Retirada, com uma agulha fina, do líquido que se acumula na barriga (ascite). Alivia o desconforto e permite analisar esse líquido."},{"slug":"mucosectomia","title":"Mucosectomia","icon":"lesao","paragraphs":["Quando a lesão pode ser extirpada pela endoscopia é muito espraiada, alargada e pouco elevada procedemos a mucosectomia. Para isso, precisamos nos certificar se a lesão embora pouco elevada não tenha crescido para dentro da parede muscular o que contraindicaria a retirada endoscópica.","Para termos tal certeza usamos o ecoendoscópio que mostra as paredes mais profundas."],"simple":"Retirada de lesões da camada mais superficial do esôfago, do estômago ou do intestino pelo próprio endoscópio, sem precisar de cirurgia aberta."},{"slug":"ligadura-elastica-de-varizes-esofagicas","title":"Ligadura Elástica de Varizes Esofágicas","icon":"varizes","paragraphs":["Algumas doenças provocam hipertensão no território da veia porta, onde existem grandes possibilidades de formação de extensas varizes no esôfago e no fundo do estomago.","Estas veias dilatadas (varicosas) tem sua parede adelgaçada que facilitam rupturas com sangramentos volumosos. Quando exibem sinais de ruptura iminente devemos proceder a ligadura elástica destas varizes.","Ligadura elástica consiste no lançamento ou amarramento deste vaso que sangra ou já parou de sangrar com uso de anéis elásticos usando um dispositivo na extremidade do endoscópio."],"simple":"Varizes no esôfago são veias dilatadas que podem sangrar. Durante a endoscopia, o médico coloca pequenos elásticos nelas para que sequem e deixem de oferecer risco."},{"slug":"hemostasia-de-vasos-sangrantes","title":"Hemostasia de Vasos Sangrantes","icon":"gota","paragraphs":["O tratamento endoscópico de lesões hemorrágicas digestivas pode envolver três abordagens principais:","I. Injeção Local de Substâncias\u003cbr />\nAdrenalina 1:10.000: Promove vasoconstrição e compressão mecânica do vaso.","Álcool absoluto: Indicado para lesões com sangramento lento; causa necrose tecidual localizada.","Ethamolin: Esclerosante que atua por compressão e ação química.","Hystoacryl: Adesivo eficaz para varizes volumosas, especialmente em pacientes com insuficiência hepática avançada (Child C).","II. Métodos Mecânicos\u003cbr />\nLigadura elástica: Técnica de escolha para varizes esofágicas com sangramento ou risco iminente. Aplica-se de 3 a 5 ligaduras por sessão.","Hemoclips: Dispositivos metálicos que comprimem a lesão; usados também para perfurações ou após mucosectomias.","Endo-loop: Laço compressivo utilizado em pedículos sangrantes, especialmente após polipectomias.","III. Métodos Físico-Químicos\u003cbr />\nHeat Probe (Eletrocautério): Coagulação tecidual superficial controlada.","Plasma de Argônio: Gás ionizado de coagulação não profunda; útil em gastropatia hipertensiva, resíduos pós-polipectomia e obstruções malignas.","Aplicações Específicas:\u003cbr />\nVarizes de esôfago: Ligadura elástica é o tratamento padrão. Requer sessões múltiplas com acompanhamento endoscópico semestral ou anual.","Varizes gástricas/duodenais volumosas: Uso preferencial de Hystoacryl, com técnica rigorosa para evitar aderência da agulha e proteger o equipamento.","Controle farmacológico adjunto: Uso de propranolol oral pode ser associado ao tratamento das varizes, com ajustes individualizados."],"simple":"Quando há um sangramento no estômago ou no intestino, o médico o interrompe durante a endoscopia, usando clipes, injeções ou cauterização."},{"slug":"esclerose-de-varizes-de-fundo-gastrico-com-histoacrilato","title":"Esclerose de Varizes de Fundo Gástrico com Histoacrilato","icon":"vaso","paragraphs":["Varizes do esôfago são veias anormalmente dilatadas, geralmente localizadas no terço distal (inferior) do esofago em consequência de um aumento da pressão do sangue causada pela cirrose do fígado.","As varizes esofágicas são uma causa frequente de hemorragia do tubo digestivo dando origem a hematémese (vômito de sangue) e melena (saída de sangue escuro pelo ânus).","Quando, durante a endoscopia alta ou colonoscopia, nos defrontamos com um vaso sangrando no fundo de uma úlcera ou vaso neoformado podemos cessar tal sangramento com uso de injeção local de substâncias esclerosantes como etanol, ethamolin, polidocanol ou solução de glicose hipertônica com adrenalina 1/1000.","Os resultados são muito benéficos e muito frequentemente evitamos cirurgias abdominais."],"simple":"Aplicação de uma espécie de cola biológica nas varizes do estômago, pelo endoscópio, para fechá-las e evitar sangramentos."},{"slug":"esclerose","title":"Esclerose","icon":"seringa","paragraphs":["Quando, durante a endoscopia alta ou colonoscopia, nos defrontamos com um vaso sangrado, o fundo de uma úlcera ou vaso neoformado, podemos cessar tal sangramento com uso de injeção local de substâncias esclerosates como etanol, ethamolin, polidocanol ou solução de glicose hipertônica com adrenalina 1/1000."],"simple":"Injeção de uma substância em veias dilatadas ou em pontos de sangramento, durante a endoscopia, para fechá-los."}],"image":"/clinigastro-demo/assets/maneco/especialidades.webp"},"exames":{"eyebrow":"Exames","title":"Exames com precisão e conforto.","text":"Exames endoscópicos e funcionais feitos com equipamentos modernos, sedação segura e equipe especializada, com toda a estrutura de um hospital dia.","image":"/clinigastro-demo/assets/maneco/exame.webp","items":[{"slug":"endoscopia-com-biopsia","title":"Endoscopia com Biópsia","icon":"estomago","paragraphs":["Endoscopia com biópsia: o que é e para que serve? Quando são encontradas áreas anormais, é realizada uma biópsia, através de instrumentos que são colocados no endoscópio. Consiste na coleta de uma amostra de tecido retirado do esôfago, estômago ou duodeno"],"simple":"Uma câmera bem fina olha por dentro do esôfago, do estômago e do começo do intestino. Se o médico vê algo diferente, retira um pedacinho (a biópsia) para análise. Você recebe sedação e não sente dor."},{"slug":"colonoscopia","title":"Colonoscopia","icon":"intestino","paragraphs":["Colonoscopia é o estudo endoscópico do intestino grosso e porção distal do intestino delgado.","É um exame realizado na investigação de sangramentos retais, pesquisa de diarreias, alterações do hábito intestinal, dores abdominais e na detecção e remoção de neoplasias.","A sedação é venosa acompanhado de oximetria, que mede constantemente a oxigenação e frequência cardíaca do paciente."],"simple":"Avalia todo o intestino grosso com uma câmera. É o principal exame para prevenir o câncer de intestino, porque permite encontrar e retirar pólipos. É feito com sedação e pede um preparo do intestino na véspera."},{"slug":"ecoendoscopia","title":"Ecoendoscopia","icon":"pancreas","paragraphs":["Ecoendoscopia, É uma nova supraespecialidade, usamos um equipamento de endoscopia marca japonesa Pentax que também tem incorporado um “probe ” de ultrassom na sua extremidade.","Este aparelho fornece a imagem endoscópica real e identifica suas camadas internas pelo sistema de ultrassom que é colocado no interior do organismo pela boca ou pelo ânus. Uma vez identificada e estudada a lesão, podemos realizar punções e biopsias, ou tratamento de lesões com injeções medicamentosas na lesão.","É muito útil no estudo de lesões subepiteliais onde a biopsias convencionais não são eficientes, na delimitação da camada do tubo digestivo onde está a lesão, nas lesões de mediastino, linfonodos, e pâncreas.","A endoscopia com biópsias aspirativas, atualmente, é o melhor método para estudo de lesões difusas, nodulares ou císticas do pâncreas."],"simple":"Junta a endoscopia com o ultrassom. Mostra com detalhes órgãos vizinhos ao tubo digestivo, como o pâncreas e os canais da bile, e permite até fazer punções guiadas."},{"slug":"retossimoidoscopia","title":"Retossigmoidoscopia","icon":"colon","paragraphs":["É um exame endoscópico que examina as regiões do ânus, reto e porção final do intestino grosso.","Ela é capaz de diagnosticar desde patologias simples como hemorroidas, fissuras e fístulas até doenças mais importantes como doenças inflamatórias crônicas, pólipos e neoplasias."],"simple":"Avalia a parte final do intestino grosso (o reto e o sigmoide). É um exame mais curto que a colonoscopia."},{"slug":"enteroscopia-por-capsula","title":"Cápsula Endoscópica","icon":"capsula","paragraphs":["Para entender a cápsula endoscópica, é preciso entender a história da sua invenção.","Na década 1990, um engenheiro militar que aperfeiçova equipamentos antimísseis, estava em pesquisa na Califórnia.","Lá, seu escritório de pesquisa ficava no mesmo andar onde trabalhava um gastroenterologista que também usava um solidéu, acessório tipicamente judaico.","Os dois se identificaram como patrícios e ficaram amigos.","Durante os encontros familiares o gastroenterologista comentou que na endoscopia alta são examinados com detalhes o esôfago, estomâgo e duodeno e na colonoscopia analisam-se com detalhes o intestino grosso.","Porém, o intestino delgado permanece na obscuridão pois os exames convencionais raramente conseguem alcançá-lo.","A enteroscopia que usa um endoscópio de 2,10m é o exame ideal, porém a sua grande demora em realizá-la, necessitando sedação profunda e demorada tem tido grande objeção pelos médicos.","Destas conversas saiu a idéia da cápsula endoscópica, um dispositivo de 13 x 26 mm composto de máquina fotográfica, bateria de energia e fonte de eletromagnetismo que sendo impulsionada pelos próprios movimentos do tubo digestivo desce colhendo duas fotos por segundo, perfazendo total de 28.000 fotografias em 8 horas de uso.","A sequência destas fotos formam um filme colorido de boa qualidade que é analisado pelo médico endoscopista da Clinigastro, em Criciuma-SC.","O exame com cápsula endoscópica está indicado:","Hemorragia digestiva não esclarecida com endoscopias.\u003cbr />\nCasos de diarreia não esclarecida.\u003cbr />\nDores abdominais não esclarecidas.\u003cbr />\nReavaliação de lesões já sabidas do Intestino Delgado como tumores, intuscepções, Doença de Crohn, Doença Celíaca,etc.\u003cbr />\nO exame usa eletro magnetismo e por isso não deve ser usado durante a gravidez e em pessoas que usem marcapasso cardíaco. Se houver estenose ou estreitamento do intestino a capsula poderia ficar impactada e requerer tratamento cirúrgico, mesmo assim ela já seria útil pois indicaria precisamente o local da obstrução."],"simple":"Você engole uma cápsula do tamanho de um comprimido grande, com uma microcâmera que fotografa o intestino delgado por dentro. Depois, ela sai naturalmente."},{"slug":"enteroscopia-de-duplo-balao","title":"Enteroscopia","icon":"biopsia","paragraphs":["A Enteroscopia de Duplo Balão é um exame avançado da gastroenterologia utilizado para avaliar o intestino delgado, região que muitas vezes não pode ser examinada completamente pelos métodos convencionais, como endoscopia e colonoscopia.","O procedimento é realizado com um endoscópio especial equipado com dois balões que auxiliam na progressão do aparelho pelo intestino, permitindo uma visualização detalhada da mucosa intestinal.","A enteroscopia de duplo balão pode ser indicada para investigação de sangramentos intestinais, anemia sem causa definida, pólipos, tumores, doença de Crohn, alterações inflamatórias e retirada de corpos estranhos ou cápsulas endoscópicas retidas.","Além do diagnóstico, o exame também possibilita tratamentos minimamente invasivos, como biópsias, cauterizações e remoção de lesões.","O procedimento é realizado com sedação, proporcionando mais conforto e segurança ao paciente."],"simple":"Chega ao intestino delgado, uma parte difícil de examinar, com um aparelho que usa pequenos balões para avançar. Também permite tratar lesões ali mesmo."},{"slug":"manometria-esofagica-e-retal","title":"Manometria Esofágica e Retal","icon":"pressao","paragraphs":["Estudo detalhado das atividades motoras. O exame é realizado através de uma sonda específica, que contém vários sensores de pressão.","Desta maneira, pode-se avaliar o comportamento manométrico das áreas de interesse.\u003cbr />\nO exame é geralmente bem tolerado e dura cerca de 20 minutos, o paciente recebe anestesia local."],"simple":"Mede a força e a coordenação dos músculos do esôfago, ou do reto e do ânus. Ajuda a investigar dificuldade para engolir, refluxo, intestino preso ou perda de controle intestinal."},{"slug":"ph-metria","title":"pHmetria e Impedanciometria Esofágica","icon":"laboratorio","paragraphs":["É introduzido um cateter de 2mm contendo em sua extremidade distal um eletrodo captador de hidrogênio iônico e deixado no esôfago distal por 24 horas no paciente.","A extremidade proximal deste cateter é ligada a um sensor que registra durante este tempo em um dispositivo computadorizado.","Ao fim deste período, os dados deste sensor são transferidos para um software especial que transforma estes sinais em números e gráficos que são analisados pelo médico gastroenterologista."],"simple":"Mede, ao longo de 24 horas, quanto ácido do estômago volta para o esôfago. É usada para confirmar e entender o refluxo."},{"slug":"cpre","title":"CPRE","icon":"vesicula","paragraphs":["A CPRE (Colangiopancreatografia Retrógrada Endoscópica) é um procedimento realizado na gastroenterologia endoscópico para diagnosticar e tratar doenças das vias biliares e do pâncreas.","O exame é feito com um endoscópio flexível introduzido pela boca até o duodeno, permitindo o acesso aos canais biliares e pancreáticos. Com a aplicação de contraste, o médico consegue identificar alterações como cálculos, obstruções, estreitamentos, inflamações e tumores.","Além do diagnóstico, a CPRE também permite tratamentos minimamente invasivos, como retirada de pedras, colocação de próteses e desobstrução dos ductos biliares.","É um procedimento seguro, realizado com sedação e indicado principalmente para pacientes com doenças pancreáticas e biliares."],"simple":"Com o endoscópio, o médico chega aos canais da bile e do pâncreas. Além de diagnosticar, permite tratar, por exemplo retirando cálculos que entopem esses canais."},{"slug":"videolaringoscopia","title":"Videolaringoscopia","icon":"garganta","paragraphs":["O exame de laringoscopia geralmente é feito em ambulatório e dura em média 10 minutos. Normalmente, o paciente está sentado e apenas pede-se a ele que ponha língua para fora. A laringe e a faringe podem às vezes receber previamente uma anestesia tópica, geralmente sob a forma de spray, quando o paciente tem muitos reflexos nauseosos a depender o caso, após o laringoscópio é introduzido pela boca ou por via nasal, conforme o caso, e direcionado às regiões que se deseja examinar.\u003cbr />\nO exame não causa maiores incômodos! Acoplado a um sistema de vídeo que permite amplificação e registro das imagens, pode ser realizado por um endoscópio laríngeo rígido ou flexível. Em ambas as situações o exame é bem tolerado pelos pacientes, pois regularmente não provoca desconforto nenhum. O paciente pode ser liberado em seguida, para retomar sua rotina diária."],"simple":"Filma a laringe e as cordas vocais com uma câmera, para investigar rouquidão, dor e alterações na voz ou na garganta."},{"slug":"nasofibrolaringoscopia","title":"Nasofibrolaringoscopia","icon":"nariz","simple":"Um tubo bem fino e flexível, com uma câmera na ponta, entra pelo nariz para o médico ver por dentro o nariz, a garganta e as cordas vocais. É rápido, feito no consultório e usa anestésico local em spray.","paragraphs":["A nasofibrolaringoscopia é um exame realizado pelo otorrinolaringologista com um aparelho flexível e muito fino, que possui uma microcâmera na extremidade.","O aparelho é introduzido pela narina e permite avaliar as fossas nasais, a rinofaringe (região atrás do nariz), a faringe e a laringe, incluindo as cordas vocais.","É indicado na investigação de obstrução nasal, sinusite, ronco e apneia, rouquidão, dificuldade para engolir, sangramentos nasais e alterações da voz. O exame é feito com anestesia tópica, dura poucos minutos e o paciente volta às atividades logo em seguida."]},{"slug":"remocao-de-cerumen","title":"Remoção de Cerúmen","icon":"orelha","simple":"É a limpeza da cera que se acumula dentro do ouvido e pode causar sensação de ouvido tampado, coceira ou diminuição da audição. O otorrino remove a cera com segurança, sem machucar o ouvido.","paragraphs":["O cerúmen é a cera produzida naturalmente pelo canal do ouvido para protegê-lo. Em algumas pessoas ele se acumula e forma uma rolha que pode causar ouvido tampado, zumbido, coceira, dor ou perda de audição.","A remoção é feita pelo otorrinolaringologista no consultório, com visualização direta do canal auditivo, por lavagem, aspiração ou instrumentos delicados, conforme cada caso.","Evite usar hastes flexíveis (cotonetes) dentro do ouvido: elas empurram a cera para o fundo e podem ferir o canal e o tímpano."]},{"slug":"crioterapia","title":"Crioterapia","icon":"frio","simple":"Tratamento que usa frio intenso para destruir, de forma controlada, pequenas lesões. É rápido, feito no consultório e costuma dispensar cortes e pontos.","paragraphs":["A crioterapia aplica temperaturas muito baixas, geralmente com nitrogênio líquido, diretamente sobre a lesão a ser tratada. O congelamento destrói as células doentes, que depois são substituídas por tecido saudável.","É um procedimento rápido, realizado em consultório, que na maioria das vezes não precisa de anestesia, cortes ou pontos.","A indicação, o número de sessões e os cuidados após a aplicação são definidos pelo médico em consulta, de acordo com o tipo e o tamanho de cada lesão."]},{"slug":"teste-respiratorio","title":"Teste Respiratório (Intolerância à Lactose, SIBO e IMO)","icon":"pulmao","simple":"Você sopra em um saquinho algumas vezes depois de beber uma solução com açúcar. O ar expirado mostra se o intestino está fermentando demais, o que ajuda a descobrir intolerância à lactose e excesso de bactérias no intestino, causas comuns de gases, estufamento e diarreia.","paragraphs":["O teste respiratório mede os gases hidrogênio e metano no ar que expiramos. Esses gases são produzidos pelas bactérias do intestino quando fermentam açúcares que não foram bem absorvidos.","É usado para investigar a intolerância à lactose, o supercrescimento bacteriano no intestino delgado (SIBO) e o supercrescimento de microrganismos produtores de metano (IMO), condições ligadas a gases, distensão abdominal, dor, diarreia ou intestino preso.","O exame não é invasivo: o paciente ingere uma solução com açúcar (lactose, glicose ou lactulose, conforme a pesquisa) e sopra em pequenos recipientes em intervalos regulares por cerca de duas a três horas. É preciso seguir uma dieta e um jejum específicos nos dias anteriores; as orientações completas são passadas no agendamento."]}]},"profissionais":{"eyebrow":"Corpo clínico","title":"Nossos especialistas","text":"Profissionais experientes, com registro ativo, trabalhando juntos nas diversas áreas da clínica.","image":"/clinigastro-demo/assets/maneco/equipe.webp","items":[{"name":"Dr. Manoel Carlos Cardoso","description":"CRM 893\nGastroenterologista (RQE 1832)\nEndoscopia Digestiva (RQE 1833)"},{"name":"Dr. Manoel Carlos de Brito Cardoso","description":"CRM 11602\nGastroenterologista (RQE 7653)\nClínica Médica (RQE 7654)"},{"name":"Dr. Andre Luiz Vasconcelos Patricio","description":"CRM 26498\nGastroenterologista (RQE 23442)"},{"name":"Dr. Eduardo Campagnaro","description":"CRM 23715\nGastroenterologista (RQE 20488)"},{"name":"Dr. Eduardo Afonso Tavares","description":"CRM 29507\nGastroenterologista"},{"name":"Dra. Vanessa Oliveira Fucilini","description":"CRM 26935\nGastroenterologista (RQE 27188)\nClínica Médica (RQE 20221)"},{"name":"Dr. Vitor de Sousa Medeiros","description":"CRM 15982\nGastroenterologista (RQE 14512)\nEndoscop ","description":"CRM 10097\nOtorrinolaringologia (RQE 13128)"},{"name":"Dr. Mateus Vasconcelos Patricio","description":"CRM 31472\nOtorrinolaringologia (RQE 27102)"},{"name":"Dra. Georgia Patricia Novack Pinheiro de Freitas Scalco","description":"CRM 19787\nOtorrinolaringologia (RQE 11404)"},{"name":"Dr. Roger da Costa Scalco","description":"CRM 20184\nOtorrinolaringologia (RQE 11529)"},{"name":"Dra. Emilli Fraga Ferreira","description":"CRM 31921\nOtorrinolaringologia (RQE 28885)"},{"name":"Mariely Barcelos","description":"CRN 101039\nNutricionista, Controle da Obesidade"},{"name":"Camila Colle Nascimento","description":"CRN 3632\nNutricionista"},{"name":"Dr. Thiago Mamoru Sakae","description":"CRM 12183\nAnestesiologia (Registro: 12522)"},{"name":"Dra. Paula Righeto Bez","description":"CRM 26068\nAnestesiologia (Registro: 23169)"}]},"contato":{"eyebrow":"Contato","title":"Fale com a gente.","text":"Tire dúvidas, solicite informações ou agende sua consulta. Respondemos o mais rápido possível.","formTitle":"Envie uma mensagem","formText":"Preencha os campos abaixo e retornaremos pelo e-mail informado.","submitLabel":"Enviar mensagem","successMessage":"Obrigado por entrar em contato! Retornaremos em breve.","image":"/clinigastro-demo/assets/uploads/2025/01/contato-img-scaled.jpg.webp","mascot":"/clinigastro-demo/assets/maneco/telefone.webp","mascotBubble":"Pode chamar, a gente responde rapidinho!"},"faq":{"eyebrow":"Dúvidas","title":"Perguntas frequentes","text":"Não encontrou sua resposta? Fale com a nossa equipe pelo WhatsApp.","items":[{"question":"Onde vocês estão localizados e quais são os contatos?","answerHtml":"\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>Unidade Criciúma (sede):\u003c/strong> Rua Antônio de Lucca, 50, Pio Corrêa, Criciúma, SC, CEP 88811-503\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Unidade Araranguá:\u003c/strong> Rua Governador Jorge Lacerda, 840, Nova Divinéia, Araranguá, SC, em anexo à SC Cardio\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Telefone (ligação):\u003c/strong> (48) 3431-9999\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>WhatsApp:\u003c/strong> (48) 3045-6979\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>E‑mail:\u003c/strong> \u003ca href=\"mailto:sac@clinigastro.com\">sac@clinigastro.com\u003c/a>\u003c/p>\n\u003c/li>\n\u003c/ul>"},{"question":"Quais são os horários de funcionamento?","answerHtml":"\u003cul>\n\u003cli>\n\u003cp>Segunda a sexta:  \u003cstrong>07:00 às 18:00\u003c/strong>\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>Sábado e domingo: \u003cstrong>fechado\u003c/strong>\u003c/p>\n\u003c/li>\n\u003c/ul>"},{"question":"Quais especialidades médicas e serviços vocês oferecem?","answerHtml":"\u003cp>Somos um hospital dia especializado em aparelho digestivo, com destaque para:\u003c/p>\n\u003cp>Gastroenterologia, coloproctologia, ecoendoscopia, CPRE, colonoscopia e endoscopia\u003c/p>\n\u003cp>Tratamento da obesidade (balão intragástrico)\u003c/p>\n\u003cp>Centro cirúrgico para cirurgias gerais, digestivas, oncológicas, pediátricas, vasculares, entre outras\u003c/p>\n\u003cp>pH‑metria, manometria\u003c/p>\n\u003cp>Atendimento também em outras áreas: nutrição, psicologia, dermatologia etc\u003c/p>"},{"question":"É possível agendar consultas online ou via WhatsApp?","answerHtml":"\u003cp>Sim! Há \u003cstrong>agendamento pelo site\u003c/strong>, via \u003cstrong>WhatsApp\u003c/strong> (48) 3045-6979\u003c/p>"},{"question":"Quais convênios são aceitos?","answerHtml":"\u003cp>\u003cstrong>Unimed, Amil, Cassi, Geap Saúde\u003c/strong>, entre mais de 52 outros convenios.\u003c/p>"},{"question":"Há estacionamento e acesso para pessoas com mobilidade reduzida?","answerHtml":"\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>Estacionamento pago em frente a clinica\u003c/strong>\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>Ambiente projetado para garantir \u003cstrong>acessibilidade e conforto\u003c/strong>\u003c/p>\n\u003c/li>\n\u003c/ul>"},{"question":"Vocês têm perfil nas redes sociais e canais de comunicação?","answerHtml":"\u003cp>Sim! Acompanhe atualizações, campanhas de saúde e novidades no Instagram:\u003cbr />\u003cstrong>@clinigastrohospitaldia\u003c/strong>\u003c/p>\n\u003cp>\u003cbr />Também estamos no Facebook (mais de 2.300 curtidas) e em outras plataformas.\u003c/p>"},{"question":"Qual é a história e missão da Clinigastro?","answerHtml":"\u003cp>Atuação desde \u003cstrong>1986/1987\u003c/strong>, pioneira em endoscopia de vídeo e colonoscopia na região\u003c/p>\n\u003cp>Missão: atendimento \u003cstrong>humanizado, diagnóstico precoce, tratamento eficaz\u003c/strong>, com integração de dados clínicos e imagem\u003c/p>"},{"question":"Como é feito o agendamento de exames e preparações?","answerHtml":"\u003cul>\n\u003cli>\n\u003cp>Pré‑agendamento pelo site, WhatsApp ou telefone\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>No local diretamente com a recepcionista \u003c/p>\n\u003c/li>\n\u003c/ul>"}]},"politicas":{"title":"Política de privacidade","html":"\u003cp>A sua privacidade é importante para nós. É política do site Clinigastro respeitar a sua privacidade em relação a qualquer informação sua que possamos coletar no site \u003ca href=\"https://www.clinigastro.com/\" target=\"_blank\" rel=\"noopener\">Clinigastro\u003c/a>, e outros sites que possuímos e operamos.\u003c/p>\n\u003cp>Trabalhamos com base na Lei de Proteção de Dados (13.709/2018) que traz garantias de privacidade, confidencialidade, retenção, proteção aos direitos fundamentais de liberdade e o livre desenvolvimento da personalidade da pessoa. Além disso, respeitamos a Constituição Federal da República Federativa do Brasil, o Código de Defesa do Consumidor (Lei 8.078/90), Marco Civil da Internet (Lei 12.965/14).\u003c/p>\n\u003cp>Solicitamos informações pessoais apenas quando realmente precisamos delas para lhe fornecer um serviço. Fazemo-lo por meios justos e legais, com o seu conhecimento e consentimento. Também informamos por que estamos coletando e como será usado.\u003c/p>\n\u003cp>Deixamos claro o motivo que estamos coletando e como será usado, pois tudo é feito para correta administração geral.\u003c/p>\n\u003cp>Apenas retemos as informações coletadas pelo tempo necessário para fornecer o serviço solicitado. Quando armazenamos dados, protegemos dentro de meios comercialmente aceitáveis pela legislação atual ​​para evitar perdas e roubos, bem como acesso, divulgação, cópia, uso ou modificação não autorizados.\u003c/p>\n\u003cp>Não compartilhamos informações de identificação pessoal publicamente ou com terceiros, exceto por determinação judicial.\u003c/p>\n\u003cp>O nosso site pode ter links para sites externos que não são operados por nós. Diante disto, não nos responsabilizamos por danos de terceiros. Esteja ciente de que não temos controle sobre o conteúdo e práticas de sites de terceiros e não podemos aceitar responsabilidade por suas respectivas políticas de privacidade.\u003c/p>\n\u003cp>Na qualidade de consumidor, você é livre para recusar a nossa solicitação de informações pessoais, entendendo que talvez não possamos fornecer alguns dos serviços desejados.\u003c/p>\n\u003cp>O uso continuado de nosso site será considerado como aceitação de nossas práticas em torno de privacidade e informações pessoais. Se você tiver alguma dúvida sobre como lidamos com dados do usuário e informações pessoais, entre em contato conosco através \u003ca href=\"/clinigastro-demo/contato/\" target=\"_blank\" rel=\"noopener\">do nosso formulário\u003c/a>.\u003c/p>\n\u003cp>Nossa política é atualizada de forma constante.\u003c/p>\n\u003cp>Fica, desde já, o titular de dados ciente que o conteúdo desta Política de Privacidade pode ser alterado a critério do site Clinigastro, independente de aviso ou notificação. Em caso de alteração, as modificações produzem todos os efeitos a partir do momento da disponibilização no site.\u003c/p>\n\u003cp>O site Clinigastro não se responsabiliza caso você venha utilizar seus dados de forma incorreta ou inverídica, ficando excluído de qualquer responsabilidade neste sentido.\u003c/p>\n\u003ch2>Política de Cookies\u003c/h2>\n\u003ch3>O que são cookies?\u003c/h3>\n\u003cp>Como é prática comum em quase todos os sites profissionais, este site usa cookies, que são pequenos arquivos baixados no seu computador, para melhorar sua experiência. Esta página descreve quais informações eles coletam, como as usamos e por que às vezes precisamos armazenar esses cookies. Também compartilharemos como você pode impedir que esses cookies sejam armazenados, no entanto, isso pode fazer o downgrade ou &#8216;quebrar&#8217; certos elementos da funcionalidade do site.\u003c/p>\n\u003ch3>Como usamos os cookies?\u003c/h3>\n\u003cp>Utilizamos cookies por vários motivos, detalhados abaixo. Infelizmente, na maioria dos casos, não existem opções padrão do setor para desativar os cookies sem desativar completamente a funcionalidade e os recursos que eles adicionam a este site. É recomendável que você deixe todos os cookies se não tiver certeza se precisa ou não deles, caso sejam usados ​​para fornecer um serviço que você usa.\u003c/p>\n\u003ch3>Desativar cookies\u003c/h3>\n\u003cp>Você pode impedir a configuração de cookies ajustando as configurações do seu navegador (consulte a Ajuda do navegador para saber como fazer isso). Esteja ciente de que a desativação de cookies afetará a funcionalidade deste e de muitos outros sites que você visita. A desativação de cookies geralmente resultará na desativação de determinadas funcionalidades e recursos deste site. Portanto, é recomendável que você não desative os cookies.\u003c/p>\n\u003ch3>Cookies que definimos\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Cookies relacionados a pesquisas\u003c/strong>\n\u003cp>Periodicamente, oferecemos pesquisas e questionários para fornecer informações interessantes, ferramentas úteis ou para entender nossa base de usuários com mais precisão. Essas pesquisas podem usar cookies para lembrar quem já participou numa pesquisa ou para fornecer resultados precisos após a alteração das páginas.\u003c/li>\n\u003cli>\u003cstrong>Cookies relacionados a formulários\u003c/strong>\n\u003cp>Quando você envia dados por meio de um formulário como os encontrados nas páginas de contato ou nos formulários de comentários, os cookies podem ser configurados para lembrar os detalhes do usuário para correspondência futura.\u003c/li>\n\u003cli>\u003cstrong>Cookies de preferências do site\u003c/strong>\n\u003cp>Para proporcionar uma ótima experiência neste site, fornecemos a funcionalidade para definir suas preferências de como esse site é executado quando você o usa. Para lembrar suas preferências, precisamos definir cookies para que essas informações possam ser chamadas sempre que você interagir com uma página que for afetada por suas preferências.\u003c/li>\n\u003c/ul>\n\u003ch3>Cookies de Terceiros\u003c/h3>\n\u003cp>Em alguns casos especiais, também usamos cookies fornecidos por terceiros confiáveis. A seção a seguir detalha quais cookies de terceiros você pode encontrar através deste site.\u003c/p>\n\u003cul>\n\u003cli>Este site usa o Google Analytics, que é uma das soluções de análise mais difundidas e confiáveis ​​da Web, para nos ajudar a entender como você usa o site e como podemos melhorar sua experiência. Esses cookies podem rastrear itens como quanto tempo você gasta no site e as páginas visitadas, para que possamos continuar produzindo conteúdo atraente.\u003cbr />\nPara mais informações sobre cookies do Google Analytics, consulte a página oficial do Google Analytics.\u003c/li>\n\u003cli>As análises de terceiros são usadas para rastrear e medir o uso deste site, para que possamos continuar produzindo conteúdo atrativo. Esses cookies podem rastrear itens como o tempo que você passa no site ou as páginas visitadas, o que nos ajuda a entender como podemos melhorar o site para você.\u003c/li>\n\u003cli>Periodicamente, testamos novos recursos e fazemos alterações sutis na maneira como o site se apresenta. Quando ainda estamos testando novos recursos, esses cookies podem ser usados ​​para garantir que você receba uma experiência consistente enquanto estiver no site, enquanto entendemos quais otimizações os nossos usuários mais apreciam.\u003c/li>\n\u003cli>À medida que vendemos produtos, é importante entendermos as estatísticas sobre quantos visitantes de nosso site realmente compram e, portanto, esse é o tipo de dados que esses cookies rastrearão. Isso é importante para você, pois significa que podemos fazer previsões de negócios com precisão que nos permitem analisar nossos custos de publicidade e produtos para garantir o melhor preço possível.\u003c/li>\n\u003c/ul>\n\u003ch3>Compromisso do Usuário\u003c/h3>\n\u003cp>O usuário se compromete a fazer uso adequado dos conteúdos e da informação que o site Clinigastro oferece e com caráter enunciativo, mas não limitativo:\u003c/p>\n\u003cul>\n\u003cli>A) Não se envolver em atividades que sejam ilegais ou contrárias à boa fé e à ordem pública;\u003c/li>\n\u003cli>B) Respeito a todas as legislações nacionais ou internacionais em que o Brasil é signatário;\u003c/li>\n\u003cli>C) Não difundir propaganda ou conteúdo de natureza racista, xenofóbica, casas de apostas, jogos de sorte e azar, qualquer tipo de pornografia ilegal, de apologia ao terrorismo ou contra os direitos humanos;\u003c/li>\n\u003cli>D) Não causar danos aos sistemas físicos (hardwares) e lógicos (softwares) do site Clinigastro, de seus fornecedores ou terceiros, para introduzir ou disseminar vírus informáticos ou quaisquer outros sistemas de hardware ou software que sejam capazes de causar danos anteriormente mencionados;\u003c/li>\n\u003cli>E) Os conteúdos publicados, possuem direitos autorais e de propriedade intelectual reservados, conforme estabelece a Lei de Direitos Autorais n. 9.610, de 19.2.1998 do Governo Federal Brasileiro e correlatas. Qualquer infringência, serão comunicados às autoridades competentes.\u003c/li>\n\u003c/ul>\n\u003ch2>Direitos do titular de dados\u003c/h2>\n\u003cp>O titular de dados pessoais possui o direito de solicitar do site Clinigastro, através do canal específico de tratamento, a qualquer momento, mediante requisição formal, informações referentes aos seus dados.\u003c/p>\n\u003cp>Os pedidos serão analisados conforme previsto em legislação vigente dentro de um prazo de 72 horas, salvo determinação legal e/ou objeto de lei.\u003c/p>\n\u003cp>Os titulares de dados, segundo o texto da LGPD, podem exercer os seus direitos por meio de:\u003c/p>\n\u003cul>\n\u003cli>Confirmação da existência de tratamento;\u003c/li>\n\u003cli>Anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com o disposto nesta Lei;\u003c/li>\n\u003cli>Informação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados;\u003c/li>\n\u003cli>Informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa;\u003c/li>\n\u003c/ul>\n\u003ch2>Como exercer os seus direitos de titular de dados?\u003c/h2>\n\u003cul>\n\u003cli>Para as demais solicitações em relação aos direitos do titular de dados pessoais, entre em contato conosco através \u003ca href=\"/clinigastro-demo/contato/\" target=\"_blank\" rel=\"noopener\">do nosso formulário\u003c/a>;\u003c/li>\n\u003c/ul>\n\u003ch2>Mais informações\u003c/h2>\n\u003cp>Esperamos que esteja esclarecido e, como mencionado anteriormente, se houver algo que você não tem certeza se precisa ou não, geralmente é mais seguro deixar os cookies ativados, caso interaja com um dos recursos que você usa em nosso site.\u003c/p>\n\u003cp>O site Clinigastro empregará esforços para resguardar as informações e dados coletados do usuário pelo site. Todavia, considerando que não há meio de transmissão e retenção de dados eletrônicos plenamente eficaz e seguro, o site Clinigastro não pode assegurar que terceiros não autorizados não logrem êxito no acesso indevido, eximindo-se de qualquer responsabilidade por danos e prejuízos decorrentes da conduta de terceiros, ataques externos ao site como: vírus, invasão ao banco de dados, vícios ou defeitos técnicos, assim como operacionais resultante da utilização do site e em razão de falhas de conexão.\u003c/p>"},"notFound":{"title":"Página não encontrada","text":"O endereço pode ter mudado, mas o Maneco te ajuda a voltar. Use os atalhos abaixo.","mascot":"/clinigastro-demo/assets/maneco/bracos-abertos.webp"},"trabalhe":{"eyebrow":"Trabalhe conosco","title":"Venha cuidar de pessoas com a gente.","text":"Envie seu currículo para fazer parte da equipe da Clinigastro. Nosso time de RH analisa cada candidatura com atenção.","formTitle":"Envie seu currículo","formText":"Preencha os campos e anexe seu currículo em PDF ou Word, com até 5 MB.","positions":["Banco de talentos","Técnico(a) de enfermagem","Enfermeiro(a)","Recepção","Administrativo"],"submitLabel":"Enviar currículo","successMessage":"Currículo recebido! Nossa equipe de RH vai analisar e entrar em contato se houver uma vaga para o seu perfil.","mascot":"","image":"/clinigastro-demo/assets/maneco/rh.webp"},"porDentro":{"eyebrow":"Como é o exame","title":"Uma viagem por dentro do seu exame.","text":"Veja, de um jeito leve e ilustrado, o caminho que a câmera faz e o que o médico pode encontrar. Assim você chega mais tranquilo no dia do exame.","disclaimer":"As ilustrações são simplificadas e servem para explicar o exame de um jeito leve, sem imagens fortes. Cada caso é único: siga sempre as orientações do seu médico e as instruções de preparo enviadas no agendamento.","exams":[{"slug":"endoscopia-com-biopsia","title":"Endoscopia","tagline":"Da boca até o começo do intestino","route":"endo","steps":[{"scene":"endo-preparo","title":"Tudo pronto","text":"Você fica deitado de lado, recebe a sedação na veia e um protetor na boca. A maioria das pessoas dorme durante todo o exame e nem se lembra dele."},{"scene":"endo-boca","title":"Boca e garganta","text":"O endoscópio é um tubo fino e flexível, com uma câmera e uma luz na ponta. Ele entra pela boca e passa pela garganta com delicadeza."},{"scene":"endo-esofago","title":"Esôfago","text":"O esôfago é o tubo que leva a comida até o estômago. A câmera desce por ele observando a parede, que deve ser lisa e rosada."},{"scene":"endo-estomago","title":"Estômago","text":"No estômago, o médico coloca um pouco de ar para abrir as dobras e enxergar tudo. Por isso pode ficar uma leve sensação de estufamento depois do exame."},{"scene":"endo-duodeno","title":"Duodeno","text":"É a primeira parte do intestino, logo depois do estômago. Aqui termina o caminho: a câmera volta devagar, olhando tudo de novo."},{"scene":"endo-fim","title":"Exame concluído","text":"Você descansa na recuperação até a sedação passar e volta para casa no mesmo dia, com um acompanhante. O laudo e as fotos ficam disponíveis para o seu médico."}],"findings":[{"scene":"endo-gastrite","title":"Gastrite","text":"É uma inflamação na parede do estômago. Na câmera aparecem áreas mais vermelhas ou inchadas. Pode ser causada por remédios, álcool, cigarro ou pela bactéria H. pylori, e tem tratamento."},{"scene":"endo-hpylori","title":"H. pylori","text":"É uma bactéria que pode viver no estômago e causar gastrite e úlcera. Ela é tão pequena que não aparece na câmera: o médico tira um pedacinho da parede com uma pinça (biópsia) e o laboratório procura por ela. Tem tratamento com antibióticos."},{"scene":"endo-ulcera","title":"Úlcera","text":"É uma ferida na parede do estômago ou do duodeno. Aparece como uma área esbranquiçada com a borda avermelhada. Na maioria das vezes melhora com remédio."},{"scene":"endo-esofagite","title":"Esofagite de refluxo","text":"Quando o ácido do estômago volta para o esôfago, ele irrita a parede, que fica com faixas avermelhadas. É o sinal do refluxo, e o tratamento alivia a azia."},{"scene":"endo-polipo","title":"Pólipo","text":"É uma pequena saliência que cresce na parede, como uma bolinha. A maioria não é grave, mas o médico pode retirar ou tirar um pedacinho para análise."},{"scene":"endo-polipectomia","title":"Retirada do pólipo","text":"Pelo próprio aparelho passa uma alça bem fininha. Ela laça o pólipo, se fecha e corta com uma corrente elétrica que também cauteriza. Não dói, e o pólipo vai para análise no laboratório."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 10 a 20 minutos."},{"icon":"gota","label":"Sedação","value":"Na veia. Você dorme e não sente o exame."},{"icon":"calendario","label":"Preparo","value":"Jejum, em geral de 8 horas, conforme a orientação recebida."},{"icon":"usuario","label":"Acompanhante","value":"Obrigatório, por causa da sedação."}]},{"slug":"colonoscopia","title":"Colonoscopia","tagline":"Todo o intestino grosso, de ponta a ponta","route":"colono","steps":[{"scene":"colo-preparo","title":"O preparo","text":"Na véspera, você segue uma dieta leve e toma um laxante para limpar o intestino. Um intestino bem limpo é o segredo de um bom exame, porque deixa a câmera enxergar tudo."},{"scene":"colo-reto","title":"Reto","text":"Com você sedado e deitado de lado, o colonoscópio entra pelo ânus. Logo no começo fica o reto, a parte final do intestino."},{"scene":"colo-sigmoide","title":"As curvas do intestino","text":"O intestino grosso tem várias curvas. O médico avança devagar, guiando a câmera por elas. Um pouco de ar ajuda a abrir o caminho."},{"scene":"colo-transverso","title":"Cólon transverso","text":"Esta parte atravessa a barriga de um lado para o outro. As dobras da parede têm um formato de triângulo, bem característico."},{"scene":"colo-ceco","title":"Ceco","text":"É o começo do intestino grosso, onde fica a entrada do apêndice. Chegar aqui significa que o intestino foi percorrido por inteiro."},{"scene":"colo-retirada","title":"A volta, com atenção","text":"Na volta, o médico examina cada dobra com calma. É nessa hora que os pólipos são procurados e retirados. Depois, você descansa e volta para casa no mesmo dia."}],"findings":[{"scene":"colo-polipo","title":"Pólipo","text":"São pequenas saliências na parede do intestino. Alguns tipos podem, com os anos, se transformar em câncer. Por isso encontrar e retirar os pólipos é a melhor forma de prevenção."},{"scene":"colo-polipectomia","title":"Retirada do pólipo","text":"Uma alça fininha passa pelo aparelho, laça o pólipo e corta com uma corrente elétrica que também cauteriza. Não dói, você nem percebe, e o pólipo vai para análise."},{"scene":"colo-diverticulos","title":"Divertículos","text":"São pequenas bolsinhas na parede do intestino, comuns depois dos 50 anos. Na câmera parecem pequenos buraquinhos. Na maioria das vezes não causam sintomas."},{"scene":"colo-hemorroidas","title":"Hemorroidas","text":"São veias dilatadas na saída do intestino, muito comuns. Para vê-las, o médico vira a ponta do aparelho para trás, olhando para a saída do intestino."},{"scene":"colo-colite","title":"Inflamação (colite)","text":"Áreas avermelhadas e inchadas podem indicar uma inflamação do intestino. O médico pode tirar pedacinhos (biópsias) para descobrir a causa."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 20 a 40 minutos."},{"icon":"gota","label":"Sedação","value":"Na veia. Você dorme e não sente o exame."},{"icon":"calendario","label":"Preparo","value":"Dieta leve e laxante na véspera, conforme a orientação recebida."},{"icon":"usuario","label":"Acompanhante","value":"Obrigatório, por causa da sedação."}]},{"slug":"retossimoidoscopia","title":"Retossigmoidoscopia","tagline":"O final do intestino grosso","route":"retosig","steps":[{"scene":"retosig-preparo","title":"Tudo pronto","text":"O preparo é simples: uma lavagem intestinal feita pouco antes do exame, conforme a orientação recebida. Você fica deitado de lado, bem coberto."},{"scene":"retosig-reto","title":"Reto","text":"Um aparelho fino e flexível, com câmera na ponta, entra com cuidado pelo ânus. O reto é a parte final do intestino, logo antes da saída."},{"scene":"retosig-sigmoide","title":"Sigmoide","text":"Logo acima vem o sigmoide, uma parte cheia de curvas. O médico coloca um pouco de ar para a parede abrir e ficar fácil de ver."},{"scene":"retosig-volta","title":"A volta","text":"Na volta, o aparelho sai devagar e o médico olha cada dobra de novo. Se encontrar algo, já pode tirar um pedacinho para análise."},{"scene":"retosig-fim","title":"Exame concluído","text":"É bem mais curto que a colonoscopia. Pode ficar uma sensação de gases por pouco tempo, que passa sozinha."}],"findings":[{"scene":"retosig-hemorroidas","title":"Hemorroidas","text":"Veias dilatadas na saída do intestino, muito comuns. Podem sangrar ou incomodar, e têm vários tratamentos."},{"scene":"retosig-fissura","title":"Fissura anal","text":"Uma feridinha em forma de risco na saída do intestino. Costuma doer ao evacuar e pode sangrar um pouco."},{"scene":"retosig-polipo","title":"Pólipo","text":"Uma bolinha que cresce na parede do intestino. Vale a pena retirar, porque alguns tipos podem virar câncer com o tempo."},{"scene":"retosig-colite","title":"Inflamação","text":"Parede avermelhada e inchada, que pode indicar uma inflamação do intestino. O médico tira biópsias para descobrir a causa."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 10 a 20 minutos."},{"icon":"gota","label":"Sedação","value":"Nem sempre é necessária; o médico orienta."},{"icon":"calendario","label":"Preparo","value":"Lavagem intestinal antes do exame, conforme a orientação."},{"icon":"usuario","label":"Acompanhante","value":"Necessário quando houver sedação."}]},{"slug":"ecoendoscopia","title":"Ecoendoscopia","tagline":"Câmera e ultrassom juntos","route":"eco","steps":[{"scene":"eco-preparo","title":"Tudo pronto","text":"É parecida com a endoscopia: você recebe sedação na veia e dorme. A diferença é que o aparelho tem um pequeno ultrassom na ponta."},{"scene":"eco-estomago","title":"Câmera e ultrassom","text":"O aparelho entra pela boca e chega ao estômago. A câmera mostra a parede por dentro, e o ultrassom enxerga através dela."},{"scene":"eco-ultrassom","title":"As camadas da parede","text":"No ultrassom, a parede aparece em camadas, como as de uma cebola. Assim o médico descobre em qual camada está uma lesão."},{"scene":"eco-pancreas","title":"Os vizinhos de perto","text":"Bem perto do estômago e do duodeno ficam o pâncreas e os canais da bile. O ultrassom mostra esses órgãos com muitos detalhes, e a cor mostra o sangue passando nos vasos."},{"scene":"eco-puncao","title":"Punção guiada","text":"Se for preciso, uma agulha bem fina sai do aparelho e, guiada pela imagem, tira uma amostra para análise. Tudo por dentro, sem cortes na barriga."},{"scene":"eco-fim","title":"Exame concluído","text":"Você descansa um pouco até a sedação passar e vai para casa com um acompanhante. O resultado das amostras sai em alguns dias."}],"findings":[{"scene":"eco-cisto","title":"Cisto no pâncreas","text":"Uma bolinha com líquido, que no ultrassom aparece toda preta. O exame mostra o tamanho e o formato, e ajuda a decidir se precisa só acompanhar ou tratar."},{"scene":"eco-calculo","title":"Pedrinha no canal da bile","text":"Um cálculo aparece como um traço bem branco, com uma sombra escura atrás. Pode causar dor e icterícia (pele amarelada)."},{"scene":"eco-subepitelial","title":"Lesão abaixo da mucosa","text":"Uma elevação lisa, coberta por parede normal. A câmera só vê o volume; o ultrassom mostra de qual camada ela vem."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 30 a 60 minutos."},{"icon":"gota","label":"Sedação","value":"Na veia. Você dorme e não sente o exame."},{"icon":"calendario","label":"Preparo","value":"Jejum, conforme a orientação recebida."},{"icon":"usuario","label":"Acompanhante","value":"Obrigatório, por causa da sedação."}]},{"slug":"cpre","title":"CPRE","tagline":"Os canais da bile e do pâncreas","route":"cpre","steps":[{"scene":"cpre-preparo","title":"Tudo pronto","text":"A CPRE é feita com sedação e com um aparelho de raio X por perto. Você dorme durante todo o procedimento."},{"scene":"cpre-papila","title":"A papila","text":"O aparelho desce pela boca até o duodeno. Lá fica a papila, uma pequena saída por onde a bile e o suco do pâncreas chegam ao intestino."},{"scene":"cpre-contraste","title":"Contraste nos canais","text":"Um tubinho entra pela papila e solta um líquido de contraste. No raio X, os canais da bile aparecem brancos, como galhos de uma árvore."},{"scene":"cpre-papilotomia","title":"Abrindo a saída","text":"Quando é preciso, o médico faz um pequeno corte na papila para alargar a saída. Não dói, porque você está sedado."},{"scene":"cpre-pedra","title":"Retirada da pedra","text":"Com um balãozinho ou uma cestinha, as pedras são puxadas para fora do canal e saem no intestino. A bile volta a passar livre."},{"scene":"cpre-fim","title":"Exame concluído","text":"Depois da CPRE você fica em observação. O médico explica os cuidados e quando voltar a comer."}],"findings":[{"scene":"cpre-calculo","title":"Pedra no canal da bile","text":"No raio X, a pedra aparece como uma falha escura dentro do contraste branco. Ela pode entupir o canal e causar dor, febre e pele amarelada."},{"scene":"cpre-estreitamento","title":"Estreitamento do canal","text":"Um trecho fino do canal faz a bile se acumular acima dele. O médico investiga a causa e pode alargar ou colocar uma prótese."},{"scene":"cpre-protese","title":"Prótese","text":"Um tubinho plástico ou metálico, colocado dentro do canal, que mantém o caminho aberto para a bile escorrer."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 30 a 90 minutos."},{"icon":"gota","label":"Sedação","value":"Sedação profunda ou anestesia."},{"icon":"calendario","label":"Preparo","value":"Jejum, conforme a orientação recebida."},{"icon":"usuario","label":"Acompanhante","value":"Obrigatório. Às vezes é preciso ficar em observação."}]},{"slug":"enteroscopia-por-capsula","title":"Cápsula endoscópica","tagline":"Uma câmera do tamanho de um comprimido","route":"capsula","steps":[{"scene":"capsula-preparo","title":"Tudo pronto","text":"Você vem em jejum, conforme a orientação, e recebe sensores na barriga ligados a um gravador que fica num cinto. Não precisa de sedação."},{"scene":"capsula-engolir","title":"Engolindo a cápsula","text":"A cápsula tem uma microcâmera, luzinhas e bateria. Você engole com um pouco de água, como um comprimido grande."},{"scene":"capsula-estomago","title":"Passeio pelo estômago","text":"Os próprios movimentos do intestino levam a cápsula adiante. Ela vai tirando fotos o tempo todo, e você pode seguir com atividades leves."},{"scene":"capsula-delgado","title":"O intestino delgado","text":"É aqui que a cápsula brilha: o intestino delgado é longo e difícil de alcançar com os outros exames. São cerca de duas fotos por segundo."},{"scene":"capsula-fotos","title":"As fotos viram um filme","text":"Depois de cerca de 8 horas, o gravador é devolvido. As milhares de fotos viram um filme, que o médico assiste com calma."},{"scene":"capsula-fim","title":"A cápsula sai sozinha","text":"A cápsula é descartável e sai naturalmente nas fezes, sem você perceber. Não precisa guardar nem devolver."}],"findings":[{"scene":"capsula-sangramento","title":"Ponto de sangramento","text":"Pequenos vasinhos dilatados (angiodisplasias) podem sangrar aos pouquinhos e causar anemia. A cápsula mostra onde eles estão."},{"scene":"capsula-crohn","title":"Doença de Crohn","text":"Feridinhas e áreas inflamadas no intestino delgado, típicas da doença de Crohn. Ajuda no diagnóstico e no acompanhamento do tratamento."},{"scene":"capsula-celiaca","title":"Doença celíaca","text":"Na doença celíaca, as vilosidades (as \"franjinhas\" do intestino) ficam achatadas, e a parede ganha um aspecto de mosaico."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 8 horas de gravação."},{"icon":"gota","label":"Sedação","value":"Não precisa. Você só engole a cápsula."},{"icon":"calendario","label":"Preparo","value":"Jejum e preparo intestinal, conforme a orientação."},{"icon":"escudo","label":"Atenção","value":"Não indicada na gravidez nem para quem usa marca-passo."}]},{"slug":"enteroscopia-de-duplo-balao","title":"Enteroscopia","tagline":"Até o intestino delgado, com balões","route":"entero","steps":[{"scene":"entero-preparo","title":"Tudo pronto","text":"O exame é feito com sedação ou anestesia. O aparelho é bem mais longo que o da endoscopia e tem dois balõezinhos."},{"scene":"entero-duodeno","title":"Passando pelo duodeno","text":"O caminho começa como na endoscopia: boca, esôfago, estômago e duodeno. Daqui para frente começa o intestino delgado."},{"scene":"entero-baloes","title":"Os dois balões","text":"Um balão segura a parede enquanto o outro avança. Depois o intestino é \"sanfonado\" no aparelho, e assim ele chega muito mais longe."},{"scene":"entero-delgado","title":"O intestino delgado","text":"A parede do intestino delgado é aveludada, cheia de franjinhas que absorvem os nutrientes. O médico examina tudo com calma."},{"scene":"entero-tratamento","title":"Tratamento na hora","text":"Além de ver, dá para tratar: cauterizar um ponto que sangra, retirar pólipos ou tirar biópsias, tudo sem cirurgia."},{"scene":"entero-fim","title":"Exame concluído","text":"Você descansa até a sedação passar e vai para casa com um acompanhante. Pode ficar um pouco de sensação de gases."}],"findings":[{"scene":"entero-sangramento","title":"Sangramento","text":"Vasinhos dilatados que sangram e causam anemia sem causa aparente. Podem ser cauterizados durante o próprio exame."},{"scene":"entero-polipo","title":"Pólipo","text":"Bolinhas na parede do intestino delgado, que podem ser retiradas com a alça durante o exame."},{"scene":"entero-capsula","title":"Cápsula presa","text":"Quando uma cápsula endoscópica fica parada num trecho estreito, a enteroscopia consegue alcançá-la e retirá-la."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 1 a 2 horas."},{"icon":"gota","label":"Sedação","value":"Sedação ou anestesia, conforme o caso."},{"icon":"calendario","label":"Preparo","value":"Jejum e, às vezes, preparo intestinal."},{"icon":"usuario","label":"Acompanhante","value":"Obrigatório, por causa da sedação."}]},{"slug":"manometria-esofagica-e-retal","title":"Manometria","tagline":"A força dos músculos do esôfago e do reto","route":"mano","steps":[{"scene":"mano-preparo","title":"Tudo pronto","text":"Um anestésico é aplicado no nariz. Você fica acordado, sentado ou deitado, e pode conversar durante o exame."},{"scene":"mano-sonda","title":"A sonda com sensores","text":"Uma sonda fininha entra pelo nariz e desce até o estômago. Ela tem vários sensores, que medem a força do esôfago em cada altura."},{"scene":"mano-gole","title":"Pequenos goles de água","text":"Você toma goles de água. Cada gole vira um mapa colorido: a faixa diagonal é a onda que empurra a água do alto até o estômago."},{"scene":"mano-esfincter","title":"A válvula do estômago","text":"No fim do esôfago há uma válvula que precisa abrir para a comida passar e fechar depois, para o ácido não subir."},{"scene":"mano-retal","title":"E a manometria retal?","text":"Na versão retal, uma sonda com balãozinho mede a força dos músculos da saída do intestino. Você aperta, relaxa e faz força quando o médico pedir."},{"scene":"mano-fim","title":"Exame concluído","text":"O exame dura cerca de 20 minutos e costuma ser bem tolerado. Você volta às suas atividades logo em seguida."}],"findings":[{"scene":"mano-acalasia","title":"Acalasia","text":"A válvula do estômago não abre direito e a onda não aparece. A comida demora a descer e pode voltar."},{"scene":"mano-espasmo","title":"Espasmo do esôfago","text":"Em vez de uma onda organizada, o esôfago aperta todo de uma vez. Pode causar dor no peito e dificuldade para engolir."},{"scene":"mano-hipotonia","title":"Válvula fraca","text":"A válvula do estômago fica sem força para fechar, e o ácido sobe com mais facilidade. É uma das causas de refluxo."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 20 minutos."},{"icon":"nariz","label":"Anestesia","value":"Local, no nariz. Sem sedação."},{"icon":"calendario","label":"Preparo","value":"Jejum e suspensão de alguns remédios, conforme a orientação."},{"icon":"usuario","label":"Depois","value":"Você volta às atividades em seguida."}]},{"slug":"ph-metria","title":"pHmetria","tagline":"O refluxo medido por 24 horas","route":"ph","steps":[{"scene":"ph-preparo","title":"Tudo pronto","text":"Um spray anestésico é aplicado no nariz. A sonda é bem fininha, com cerca de 2 milímetros, e você fica acordado."},{"scene":"ph-sensor","title":"O sensor no esôfago","text":"A ponta da sonda fica no fim do esôfago, pouco acima do estômago. Toda vez que o ácido sobe, o sensor registra."},{"scene":"ph-casa","title":"24 horas em casa","text":"A sonda fica ligada a um aparelhinho por 24 horas. Você come, dorme e trabalha normalmente, e aperta botões para marcar refeições, quando deita e quando sente algo."},{"scene":"ph-grafico","title":"O gráfico das 24 horas","text":"No dia seguinte, os dados viram um gráfico. Cada descida da linha abaixo de 4 é um momento em que o ácido subiu."},{"scene":"ph-fim","title":"Sonda retirada","text":"A sonda sai em segundos. O médico analisa o gráfico e explica o resultado na consulta."}],"findings":[{"scene":"ph-acido","title":"Refluxo ácido","text":"Muitas descidas, ou descidas longas, mostram que o ácido fica tempo demais no esôfago. Isso confirma a doença do refluxo."},{"scene":"ph-nao-acido","title":"Refluxo não ácido","text":"A impedanciometria percebe o que sobe mesmo sem ácido, como líquido e gás. Explica sintomas de quem já usa remédio para o estômago."},{"scene":"ph-sintoma","title":"Sintoma junto com o refluxo","text":"Quando os botões de sintoma coincidem com as descidas da linha, fica claro que a queimação ou a tosse vêm do refluxo."}],"facts":[{"icon":"relogio","label":"Duração","value":"24 horas com a sonda."},{"icon":"nariz","label":"Anestesia","value":"Spray no nariz, sem sedação."},{"icon":"calendario","label":"Preparo","value":"Jejum e suspensão de remédios para o estômago, conforme a orientação."},{"icon":"usuario","label":"Durante","value":"Rotina normal, anotando refeições e sintomas."}]},{"slug":"teste-respiratorio","title":"Teste respiratório","tagline":"Lactose, SIBO e IMO no sopro","route":"sopro","steps":[{"scene":"sopro-preparo","title":"Tudo pronto","text":"Nos dias anteriores, você segue uma dieta e um jejum específicos, enviados no agendamento. Não tem agulha nem sedação."},{"scene":"sopro-basal","title":"O primeiro sopro","text":"Antes de tudo, você sopra num saquinho. Esse primeiro sopro mostra como está o ar quando você ainda não tomou nada."},{"scene":"sopro-solucao","title":"A solução com açúcar","text":"Depois, você bebe uma solução com um tipo de açúcar: lactose, glicose ou lactulose, conforme o que vai ser pesquisado."},{"scene":"sopro-fermentacao","title":"As bactérias fermentam","text":"O açúcar que não é bem absorvido vira comida para as bactérias do intestino. Elas fermentam e produzem gases: hidrogênio e metano."},{"scene":"sopro-pulmao","title":"O gás chega ao pulmão","text":"Parte desses gases passa para o sangue, chega aos pulmões e sai na respiração. Por isso o sopro conta o que acontece no intestino."},{"scene":"sopro-coletas","title":"Um sopro de tempos em tempos","text":"Você sopra de novo em intervalos regulares, por cerca de duas a três horas, descansando na clínica entre um sopro e outro."},{"scene":"sopro-resultado","title":"O gráfico dos gases","text":"Os gases de cada sopro viram um gráfico. A forma e a hora em que as linhas sobem mostram o que está acontecendo."},{"scene":"sopro-fim","title":"Teste concluído","text":"Você volta às suas atividades normalmente. O médico explica o resultado e o tratamento, se for o caso."}],"findings":[{"scene":"sopro-lactose","title":"Intolerância à lactose","text":"A lactose, o açúcar do leite, não é bem digerida e chega inteira ao intestino grosso. Lá ela fermenta, e o hidrogênio sobe no sopro."},{"scene":"sopro-sibo","title":"SIBO","text":"É o excesso de bactérias no intestino delgado. Elas fermentam o açúcar cedo demais, e o gás sobe logo no início do teste."},{"scene":"sopro-imo","title":"IMO","text":"Alguns micróbios produzem metano, um gás que deixa o intestino mais lento. É uma causa comum de intestino preso e estufamento."}],"facts":[{"icon":"relogio","label":"Duração","value":"Cerca de 2 a 3 horas."},{"icon":"escudo","label":"Invasivo?","value":"Não. Você só bebe a solução e sopra."},{"icon":"calendario","label":"Preparo","value":"Dieta e jejum específicos nos dias anteriores."},{"icon":"hospital","label":"Onde","value":"Na clínica, em repouso entre os sopros."}]},{"slug":"nasofibrolaringoscopia","title":"Nasofibrolaringoscopia","tagline":"Pelo nariz até as cordas vocais","route":"naso","steps":[{"scene":"naso-preparo","title":"Tudo pronto","text":"Um spray anestésico é aplicado no nariz. Você fica sentado e acordado, e respira normalmente durante todo o exame."},{"scene":"naso-nariz","title":"Dentro do nariz","text":"Um tubo bem fino e flexível entra pela narina. A câmera mostra o septo, a parede que divide o nariz ao meio, e as conchas nasais, que aquecem e umedecem o ar."},{"scene":"naso-rinofaringe","title":"Atrás do nariz","text":"Atrás do nariz fica a rinofaringe, onde estão as adenoides e a entrada dos canais que ligam o nariz aos ouvidos. Aqui a câmera faz uma curva suave para baixo."},{"scene":"naso-laringe","title":"Cordas vocais","text":"Lá embaixo aparecem as cordas vocais, em formato de V. O médico pede para você respirar fundo e falar \"iiii\" para ver como elas se movem."},{"scene":"naso-fim","title":"Exame concluído","text":"O exame dura poucos minutos. Você volta às suas atividades logo em seguida; só espere o efeito do anestésico passar para comer ou beber."}],"findings":[{"scene":"naso-septo","title":"Desvio de septo","text":"Quando a parede que divide o nariz é torta e estreita um dos lados. Pode dificultar a respiração e deixar o nariz entupido."},{"scene":"naso-rinite","title":"Rinite","text":"As conchas nasais ficam inchadas e pálidas, geralmente por alergia, e entopem o nariz. Tem tratamento com remédios e cuidados com o ambiente."},{"scene":"naso-polipo","title":"Pólipo nasal","text":"São saliências moles e claras, parecidas com uvas pequenas, que podem aparecer em quem tem sinusite ou rinite há muito tempo."},{"scene":"naso-adenoide","title":"Adenoide aumentada","text":"Mais comum em crianças, pode tampar a passagem do ar atrás do nariz e causar ronco e respiração pela boca."},{"scene":"naso-nodulo","title":"Nódulo nas cordas vocais","text":"É como um calinho nas cordas vocais, causado pelo uso intenso da voz. Impede que elas se fechem por inteiro e deixa a voz rouca."}],"facts":[{"icon":"relogio","label":"Duração","value":"Poucos minutos."},{"icon":"nariz","label":"Anestesia","value":"Spray no nariz, sem sedação."},{"icon":"calendario","label":"Preparo","value":"Em geral, sem preparo especial."},{"icon":"usuario","label":"Depois","value":"Você volta às atividades em seguida."}]},{"slug":"videolaringoscopia","title":"Videolaringoscopia","tagline":"Pela boca, para ver a laringe e a voz","route":"laringo","steps":[{"scene":"laringo-preparo","title":"Tudo pronto","text":"Você fica sentado, com a língua levemente puxada para fora com uma gaze. Às vezes um spray anestésico é usado na garganta."},{"scene":"laringo-boca","title":"Fundo da boca","text":"Uma ótica com câmera entra pela boca até o fundo da garganta, sem passar dela. Você só precisa respirar com calma."},{"scene":"laringo-laringe","title":"A laringe vista de cima","text":"A câmera mostra a epiglote, que fecha a passagem quando engolimos, e as cordas vocais abertas para o ar passar."},{"scene":"laringo-fonacao","title":"Cordas vocais em ação","text":"Ao falar \"iiii\", as cordas vocais se fecham e vibram. É assim que nasce a voz, e é assim que o médico avalia se elas se movem bem."},{"scene":"laringo-fim","title":"Exame concluído","text":"O exame é feito no consultório e dura poucos minutos. Você volta às suas atividades logo em seguida."}],"findings":[{"scene":"laringo-nodulo","title":"Nódulos vocais","text":"São calinhos nos dois lados das cordas vocais, causados pelo uso intenso da voz. Deixam a voz rouca e costumam melhorar com fonoterapia."},{"scene":"laringo-polipo","title":"Pólipo vocal","text":"Uma pequena bolinha em uma das cordas vocais, que atrapalha a vibração e deixa a voz rouca. Em alguns casos é retirado com uma cirurgia simples."},{"scene":"laringo-laringite","title":"Laringite e refluxo","text":"A laringe fica avermelhada e inchada. Pode ser por infecção, uso excessivo da voz ou pelo ácido do estômago que sobe até a garganta."}],"facts":[{"icon":"relogio","label":"Duração","value":"Poucos minutos."},{"icon":"garganta","label":"Anestesia","value":"Spray na garganta, quando necessário."},{"icon":"calendario","label":"Preparo","value":"Em geral, sem preparo especial."},{"icon":"hospital","label":"Onde","value":"Feito no consultório."}]},{"slug":"remocao-de-cerumen","title":"Remoção de cerúmen","tagline":"Limpeza da cera do ouvido","route":"ouvido","steps":[{"scene":"ouvido-preparo","title":"Olhando o ouvido","text":"O otorrino olha dentro do ouvido com uma luz e uma lente de aumento. Você fica sentado, e não precisa de anestesia."},{"scene":"ouvido-canal","title":"O canal do ouvido","text":"O canal do ouvido tem pelinhos e glândulas que produzem a cera, que protege o ouvido. No fim do canal fica o tímpano."},{"scene":"ouvido-rolha","title":"A rolha de cera","text":"Às vezes a cera se acumula e forma uma rolha, que deixa o ouvido tampado, com coceira ou zumbido. Cotonetes empurram a cera para o fundo e pioram a rolha."},{"scene":"ouvido-remocao","title":"A remoção","text":"Com aspiração, lavagem ou instrumentos delicados, o médico retira a cera aos pouquinhos, olhando o tempo todo. Costuma ser rápido e não dói."},{"scene":"ouvido-timpano","title":"Tímpano livre","text":"Sem a cera, aparece o tímpano: uma membrana fininha e brilhante, que vibra com o som. O ouvido fica livre e a audição volta ao normal."}],"findings":[],"facts":[{"icon":"relogio","label":"Duração","value":"Poucos minutos."},{"icon":"orelha","label":"Anestesia","value":"Não precisa. Costuma ser indolor."},{"icon":"calendario","label":"Preparo","value":"Às vezes, gotas para amolecer a cera antes."},{"icon":"hospital","label":"Onde","value":"Feito no consultório."}]},{"slug":"crioterapia","title":"Crioterapia","tagline":"Frio intenso para tratar pequenas lesões","route":"crio","steps":[{"scene":"crio-preparo","title":"Tudo pronto","text":"A crioterapia é feita no consultório e é rápida. Na maioria das vezes não precisa de anestesia, cortes nem pontos."},{"scene":"crio-lesao","title":"A lesão","text":"O médico examina a lesão com atenção e define a área a ser tratada, preservando o tecido saudável em volta."},{"scene":"crio-aplicacao","title":"Aplicação do frio","text":"Um aplicador leva nitrogênio líquido, muito gelado, direto sobre a lesão. Ela congela por alguns segundos. Pode arder um pouquinho."},{"scene":"crio-cicatrizacao","title":"A cicatrização","text":"Nos dias seguintes, a área congelada forma uma casquinha, que cai sozinha. Por baixo nasce tecido novo e saudável."},{"scene":"crio-fim","title":"Tratamento concluído","text":"O número de sessões e os cuidados depois da aplicação são definidos pelo médico, de acordo com o tipo e o tamanho de cada lesão."}],"findings":[],"facts":[{"icon":"relogio","label":"Duração","value":"Poucos minutos."},{"icon":"frio","label":"Anestesia","value":"Na maioria das vezes, não precisa."},{"icon":"hospital","label":"Onde","value":"Feita no consultório."},{"icon":"calendario","label":"Sessões","value":"Definidas pelo médico conforme a lesão."}]}]}}}</script>
